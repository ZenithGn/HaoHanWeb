[package]
name = "haohan-backend"
version = "0.1.0"
edition = "2024"
default-run = "haohan-backend"

[lib]
name = "haohan_backend"
path = "src/lib.rs"

[[bin]]
name = "haohan-backend"
path = "src/main.rs"

[dependencies]
# Web & async runtime
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "timeout",
    "limit",
    "compression-br",
    "compression-gzip",
    "request-id",
] }

# Database (SQLite WAL via sqlx 0.8 runtime-checked queries)
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth & cryptography
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = "0.5"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"
rand = "0.8"

# HTTP client & caching
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
moka = { version = "0.12", features = ["future"] }
arc-swap = "1"
bytes = "1"

# Config, errors & observability
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
time = { version = "0.3", features = ["formatting", "parsing"] }
num_cpus = "1"
regex = "1"
url = "2"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
