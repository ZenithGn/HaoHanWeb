services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haohan-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3001
      - DATABASE_URL=sqlite:///data/haohan.db
    volumes:
      - ./backend/data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
